apiVersion: apps/v1
kind: Deployment
metadata:
  name: chord-node-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chord-node-1
  template:
    metadata:
      labels:
        app: chord-node-1
    spec:
      containers:
      - name: chord-node
        image: surajs27/chord-node:v2
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ID
          value: "1"
        - name: PRED_ID
          value: "28"  # Example predecessor ID
        - name: FINGER_TABLE
          value: "4,4,9,9,18"  # Example finger table

